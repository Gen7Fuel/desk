purpose:
  stands_in_for: Azure Blob Storage REST during a service outage
  unblocks: Verification that Desk backup does not claim success when storage is unavailable
assumptions:
  - id: unavailable-storage
    status: supported
    claim: The real backup tick and Azure SDK reject HTTP 503 from the lock creation operation before publishing any successful recovery point in the tested scenario.
    reason: The Postman mock returned Azure-shaped ServerBusy XML. The real caller received statusCode 503 and the outage verification script passed.
    verification: Ran Postman 1.75.0 on port 4198 and scripts/verify-cdn-backup-outage.cjs on 2026-11-16. Request log observed PUT to the status/lock blob. No successful storage behavior is modeled here.
    source: postman/mocks/cdn-backup-storage-outage/default.js; scripts/verify-cdn-backup-outage.cjs; backend/apps/cdn/cdn.backup.js
    updated_at: '2026-11-16'
  - id: successful-provider-semantics
    status: supported
    claim: Successful archive uploads, leases, conditional reads, and restore checks worked in a three-file isolated smoke check against the production Azure account.
    reason: The actual backup archive and lease code ran in the existing Desk image against three live source files, writing only a unique cdn_restore_tests subtree. The outage mock models no successful provider behavior and was adapted from Hub's fixture; no owner mock was fetched.
    verification: Passed scripts/verify-cdn-backup-azure.cjs on 2026-11-16; restored three files with byte/checksum/date checks, verified 1155584 archive bytes, and removed all isolated test objects. Full first-run coverage remains pending.
    source: backend/apps/cdn/cdn.backup.checks.cjs; docs/cdn-backups.md
    updated_at: '2026-11-16'
  - id: migrated-source-outage
    status: supported
    claim: A source-list HTTP 503 rejects the real backup tick without publishing an archive or replacing the previous success.
    reason: Actual Azure SDK inventory requested the Postman outage member while destination control writes used an in-memory fixture. The source was not retried against legacy media.
    verification: On 2026-11-17 scripts/verify-cdn-backup-source-outage.cjs passed; simulation logged GET /testaccount/files with prefix cdn/ and status 503. Existing lock outage script also passed with PUT 503. Live cross-account authentication and full new-source backup remain unverified.
    source: scripts/verify-cdn-backup-source-outage.cjs; backend/apps/cdn/cdn.backup.js; docs/cdn-backup-source-migration.md
    updated_at: '2026-11-17'
  - id: bounded-archive-readback
    status: supported
    claim: The range readback helper recovers from an interrupted HTTP response without hashing partial bytes twice, while retaining the uploaded ETag on every request in the tested scenario.
    reason: The real Azure SDK requested bounded ranges from a local HTTP fixture that destroyed one response after sending a partial body; the same range was retried and the complete archive SHA-256 matched.
    verification: On 2026-11-17 the 18 backup checks passed, including the real SDK HTTP interruption, persistent abort, changed ETag, corruption and lease loss cases. Postman 1.75.0 outage checks also passed with observed PUT lock and GET source-list HTTP 503 requests. The existing outage mock does not model streaming success or disconnects; that case uses the local HTTP fixture.
    source: backend/apps/cdn/cdn.backup-readback.checks.cjs; backend/apps/cdn/cdn.backup.checks.cjs; scripts/verify-cdn-backup-outage.cjs; scripts/verify-cdn-backup-source-outage.cjs
    updated_at: '2026-11-17'
  - id: production-readback-recovery
    status: unknown
    claim: The new bounded-range verifier completes full production monthly archives despite the previously observed interrupted attempts.
    reason: Production attempts ended without a completion receipt after archive upload. The deployed worker does not expose the failure stage, so a download interruption is a working diagnosis rather than a proved root cause. The new helper and stage diagnostics are prepared on a feature branch and have not been deployed.
    verification: Local synthetic checks passed on 2026-11-17. A real production monthly archive completed with the reviewed new worker is still required before claiming recovery.
    source: backend/apps/cdn/cdn.backup-readback.js; backend/apps/cdn/cdn.backup-worker.js; docs/cdn-backups.md
    updated_at: '2026-11-17'
