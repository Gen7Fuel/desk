name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      # Fails on any high/critical advisory that is not allowlisted with a
      # written reason in scripts/audit-ci.mjs. See CLAUDE.md ("Dependency audits").
      - name: Audit
        run: node scripts/audit-ci.mjs frontend

  backend:
    name: Backend — test & audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Test
        working-directory: backend
        run: npm test

      # Fails on any high/critical advisory that is not allowlisted with a
      # written reason in scripts/audit-ci.mjs. See CLAUDE.md ("Dependency audits").
      - name: Audit
        run: node scripts/audit-ci.mjs backend
